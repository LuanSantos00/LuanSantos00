name: Metrics

# Sem gatilho de push: a própria Action comita o SVG, e um commit
# feito com PAT dispara workflows novamente, gerando loop infinito.
on:
  schedule:
    - cron: "0 9 * * *"   # todos os dias às 06:00 (Brasília)
  workflow_dispatch:       # execução manual

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: LuanSantos00
          filename: github-metrics.svg
          committer_message: "chore: update metrics [skip ci]"
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/Sao_Paulo
          config_theme: dark
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
